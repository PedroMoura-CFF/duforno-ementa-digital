<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Menu digital do duforno — deliciosas francesinhas do forno para o prato. Disponível em português, inglês, francês e espanhol." />
<title>duforno — Ementa Digital</title>
<style>
  :root {
    --brasa: #c1502e;
    --brasa-dark: #9c3d22;
    --carvao: #201a17;
    --carvao-suave: #2c241f;
    --creme: #f6ede1;
    --creme-forte: #eaddc9;
    --dourado: #d9a441;
    --texto-claro: #f6ede1;
    --texto-suave: #c9b8a5;
    --sombra: rgba(0, 0, 0, 0.35);
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--carvao);
    color: var(--texto-claro);
    -webkit-font-smoothing: antialiased;
  }

  .pagina {
    max-width: 1040px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--carvao);
    box-shadow: 0 0 60px var(--sombra);
  }

  header.topo {
    position: relative;
    padding: 2.4rem 1.5rem 2.4rem;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(193, 80, 46, 0.25), transparent 60%),
      linear-gradient(180deg, var(--carvao-suave), var(--carvao));
    border-bottom: 1px solid rgba(217, 164, 65, 0.25);
  }

  .topo-controlos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }

  .idiomas {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
  }

  .idiomas button {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    border: 1px solid rgba(217, 164, 65, 0.3);
    background: transparent;
    color: var(--texto-suave);
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .idiomas button svg {
    width: 18px;
    height: 12px;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    flex: 0 0 auto;
    display: block;
  }
  .idiomas button:hover { border-color: var(--dourado); color: var(--creme); }
  .idiomas button.ativo {
    background: var(--dourado);
    border-color: var(--dourado);
    color: var(--carvao);
    font-weight: bold;
  }

  .marca {
    display: block;
    width: min(280px, 70vw);
    height: auto;
    margin: 0 auto 0.6rem;
  }

  header.topo p.subtitulo {
    margin: 0.5rem 0 0;
    color: var(--dourado);
    font-style: italic;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }

  .linha-decorativa {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 1.4rem;
    color: var(--texto-suave);
  }
  .linha-decorativa span { font-size: 0.75rem; letter-spacing: 0.15em; }
  .linha-decorativa .traco {
    width: 46px;
    height: 1px;
    background: rgba(217, 164, 65, 0.5);
  }

  .botao-menu {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    border: 1px solid rgba(217, 164, 65, 0.4);
    background: transparent;
    color: var(--creme);
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .botao-menu:hover { border-color: var(--dourado); background: rgba(217, 164, 65, 0.1); }
  .botao-menu .icone { font-size: 1.05rem; line-height: 1; }

  .fundo-menu {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 25;
  }
  .fundo-menu.visivel { opacity: 1; pointer-events: auto; }

  nav.categorias {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 30;
    width: 270px;
    max-width: 82vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: var(--carvao-suave);
    border-right: 1px solid rgba(217, 164, 65, 0.25);
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.4);
    transform: translateX(-100%);
    transition: transform 0.28s ease;
    scrollbar-width: thin;
  }

  nav.categorias.aberto { transform: translateX(0); }

  .cabecalho-menu {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.3rem;
    border-bottom: 1px solid rgba(217, 164, 65, 0.2);
  }
  .cabecalho-menu span {
    color: var(--dourado);
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .botao-fechar-menu {
    background: transparent;
    border: none;
    color: var(--texto-suave);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.2rem 0.5rem;
  }
  .botao-fechar-menu:hover { color: var(--creme); }

  nav.categorias button {
    width: 100%;
    text-align: left;
    padding: 0.95rem 1.4rem;
    border: none;
    border-bottom: 1px solid rgba(217, 164, 65, 0.12);
    border-radius: 0;
    background: transparent;
    color: var(--texto-suave);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: normal;
    line-height: 1.3;
    position: relative;
  }

  nav.categorias button:hover {
    background: rgba(217, 164, 65, 0.08);
    color: var(--creme);
  }

  nav.categorias button.ativo {
    background: rgba(193, 80, 46, 0.2);
    color: var(--creme);
    font-weight: bold;
  }

  nav.categorias button.ativo::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--brasa);
  }

  main {
    padding: 1.8rem 1.5rem 3rem;
  }

  section.categoria {
    margin-bottom: 3.4rem;
    scroll-margin-top: 1.5rem;
  }

  section.categoria > h2 {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 1.5rem;
    color: var(--dourado);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 0.3rem;
  }

  section.categoria > .descricao-categoria {
    color: var(--texto-suave);
    font-style: italic;
    font-size: 0.92rem;
    margin: 0 0 1.4rem;
  }

  /* Cartões com fotografia (destaques) */
  .grelha-fotos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.6rem;
  }

  .item {
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
    background: var(--carvao-suave);
    border: 1px solid rgba(217, 164, 65, 0.18);
    box-shadow: 0 10px 24px var(--sombra);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }

  .item:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px var(--sombra);
  }

  .item .foto {
    width: 100%;
    height: 230px;
    background: linear-gradient(160deg, var(--carvao-suave), var(--carvao));
  }
  .item .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .item .info { padding: 1.1rem 1.3rem 1.4rem; }

  .item .info .linha-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.8rem;
  }

  .item .info h3 {
    margin: 0 0 0.4rem;
    font-size: 1.22rem;
    color: var(--creme);
    font-weight: normal;
    line-height: 1.3;
  }

  .item .info .preco {
    flex: 0 0 auto;
    font-size: 1.05rem;
    color: var(--brasa);
    font-weight: bold;
    white-space: nowrap;
  }

  .item .info p {
    margin: 0;
    color: var(--texto-suave);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .etiqueta {
    display: inline-block;
    margin-left: 0.5rem;
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--carvao);
    background: var(--dourado);
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    vertical-align: middle;
  }

  /* Listas de texto (categorias completas com preços) */
  .lista {
    border: 1px solid rgba(217, 164, 65, 0.2);
    border-radius: 14px;
    padding: 0.4rem 1.4rem;
    background: rgba(255, 255, 255, 0.015);
  }

  /* Cartões horizontais (foto de um lado, informação do outro) */
  .grelha-cartoes-horizontais {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .lista-item {
    display: flex;
    border-radius: 14px;
    overflow: hidden;
    background: var(--carvao-suave);
    border: 1px solid rgba(217, 164, 65, 0.18);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .lista-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px var(--sombra);
  }

  .lista-item .foto-metade {
    flex: 0 0 108px;
    width: 108px;
    min-height: 108px;
    background: linear-gradient(160deg, var(--carvao-suave), var(--carvao));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lista-item .foto-metade img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .lista-item .foto-metade img.simbolo {
    object-fit: contain;
    padding: 22px;
  }
  .lista-item .info-metade {
    flex: 1 1 58%;
    min-width: 0;
    padding: 0.9rem 1.1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .lista-item .linha-topo {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .lista-item h3 {
    margin: 0;
    font-size: 1rem;
    color: var(--creme);
    font-weight: normal;
    line-height: 1.3;
  }

  .lista-item .preco {
    font-size: 0.98rem;
    color: var(--brasa);
    font-weight: bold;
  }

  .lista-item .ver-mais {
    margin-top: 0.6rem;
    color: var(--dourado);
    font-size: 0.76rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .lista-item .ver-mais::after {
    content: '→';
    transition: transform 0.2s ease;
  }
  .lista-item:hover .ver-mais::after { transform: translateX(3px); }

  .subtitulo-lista {
    color: var(--dourado);
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 1.6rem 0 0.2rem;
  }
  .subtitulo-lista:first-child { margin-top: 0.6rem; }

  /* Extras em grelha compacta de duas colunas */
  .grelha-extras {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0 2rem;
  }
  .linha-extra {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.55rem 0;
    border-bottom: 1px dashed rgba(217, 164, 65, 0.15);
    font-size: 0.9rem;
  }
  .linha-extra span:first-child { color: var(--texto-claro); }
  .linha-extra span:last-child { color: var(--brasa); font-weight: bold; white-space: nowrap; }

  footer.rodape {
    text-align: center;
    padding: 2.4rem 1.5rem 3rem;
    border-top: 1px solid rgba(217, 164, 65, 0.2);
    color: var(--texto-suave);
    font-size: 0.85rem;
  }

  footer.rodape .redes {
    margin-top: 0.5rem;
    color: var(--dourado);
    font-size: 0.85rem;
  }

  footer.rodape a {
    color: var(--dourado);
    text-decoration: none;
  }
  footer.rodape a:hover { text-decoration: underline; }

  footer.rodape .aviso {
    margin-top: 1rem;
    font-size: 0.72rem;
    color: rgba(201, 184, 165, 0.55);
    line-height: 1.5;
  }

  @media (max-width: 600px) {
    main { padding: 1.4rem 1rem 2.4rem; }
  }

  @media (max-width: 480px) {
    .marca { width: min(220px, 65vw); }
    .grelha-fotos { grid-template-columns: 1fr; }
    .item .foto { height: 210px; }
    .lista { padding: 0.4rem 1rem; }
    .lista-item .info-metade { padding: 0.7rem 0.8rem; }
    .lista-item h3 { font-size: 0.92rem; }
  }

  /* Modal de detalhe do prato */
  .fundo-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .fundo-modal.visivel { opacity: 1; pointer-events: auto; }

  .modal-prato {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(480px, 92vw);
    max-height: 88vh;
    overflow-y: auto;
    background: var(--carvao-suave);
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    z-index: 41;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.96);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .modal-prato.aberto {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .modal-fechar {
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
    z-index: 2;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(217, 164, 65, 0.4);
    background: rgba(32, 26, 23, 0.7);
    color: var(--creme);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .modal-fechar:hover { background: var(--brasa); border-color: var(--brasa); }

  .modal-foto {
    width: 100%;
    height: 320px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(160deg, var(--carvao-suave), var(--carvao));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-foto img.simbolo { object-fit: contain; padding: 50px; }

  .modal-corpo { padding: 1.5rem 1.6rem 1.9rem; }

  .modal-corpo h3 {
    margin: 0 0 0.3rem;
    font-size: 1.5rem;
    color: var(--creme);
    font-weight: normal;
    line-height: 1.25;
  }
  .modal-nome-secundario {
    display: block;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--texto-suave);
    margin-top: 0.25rem;
  }

  .modal-preco {
    color: var(--brasa);
    font-weight: bold;
    font-size: 1.2rem;
    margin: 0.4rem 0 1rem;
  }

  .modal-desc {
    color: var(--texto-suave);
    font-size: 0.94rem;
    line-height: 1.6;
    margin: 0 0 1.3rem;
  }
  .modal-desc p { margin: 0 0 0.8rem; }
  .modal-desc p:last-child { margin-bottom: 0; }

  .modal-ingredientes-titulo {
    color: var(--dourado);
    text-transform: uppercase;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    margin: 0 0 0.7rem;
  }

  .lista-ingredientes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .lista-ingredientes.lista-ingredientes-fotos {
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 1.1rem;
    padding-bottom: 0.4rem;
  }

  .ingrediente-foto {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
    flex: 0 0 auto;
    width: 68px;
  }
  .ingrediente-foto img {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(217, 164, 65, 0.4);
  }
  .ingrediente-foto span {
    font-size: 0.7rem;
    color: var(--texto-suave);
    text-align: center;
    line-height: 1.25;
  }

  .tag-ingrediente {
    background: rgba(217, 164, 65, 0.1);
    border: 1px solid rgba(217, 164, 65, 0.3);
    color: var(--creme-forte);
    font-size: 0.8rem;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
  }

</style>
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <div class="topo-controlos">
        <button class="botao-menu" id="botao-abrir-menu" aria-label="Abrir menu">
          <span class="icone">☰</span>
          <span id="texto-botao-menu"></span>
        </button>
        <div class="idiomas" id="seletor-idiomas"></div>
      </div>
      <img class="marca" src="imagens/web/logo.png" alt="duforno" />
      <p class="subtitulo" id="texto-subtitulo"></p>
      <div class="linha-decorativa">
        <span class="traco"></span>
        <span id="texto-ementa"></span>
        <span class="traco"></span>
      </div>
    </header>

    <div class="fundo-menu" id="fundo-menu"></div>

    <div class="fundo-modal" id="fundo-modal"></div>
    <div class="modal-prato" id="modal-prato">
      <button class="modal-fechar" id="modal-fechar" aria-label="Fechar">✕</button>
      <div class="modal-foto" id="modal-foto"></div>
      <div class="modal-corpo">
        <h3>
          <span id="modal-nome-principal"></span>
          <span class="modal-nome-secundario" id="modal-nome-secundario"></span>
        </h3>
        <span id="modal-badge"></span>
        <p class="modal-preco" id="modal-preco"></p>
        <p class="modal-desc" id="modal-desc"></p>
        <p class="modal-ingredientes-titulo" id="modal-ingredientes-titulo"></p>
        <div class="lista-ingredientes" id="modal-lista-ingredientes"></div>
      </div>
    </div>

    <nav class="categorias" id="nav-categorias">
      <div class="cabecalho-menu">
        <span id="texto-cabecalho-menu"></span>
        <button class="botao-fechar-menu" id="botao-fechar-menu" aria-label="Fechar menu">✕</button>
      </div>
      <div id="itens-nav-categorias"></div>
    </nav>

    <div class="coluna-conteudo">
      <main id="conteudo"></main>

      <footer class="rodape">
        <p id="rodape-nome"></p>
        <p class="redes">
          <a href="https://www.instagram.com/duforno.pt" target="_blank" rel="noopener">Instagram @duforno.pt</a>
          &nbsp;·&nbsp;
          <a href="https://www.facebook.com/duforno.pt" target="_blank" rel="noopener">Facebook duforno.pt</a>
        </p>
        <p class="aviso" id="rodape-aviso"></p>
      </footer>
    </div>
  </div>

  <script>
    const IDIOMAS = [
      { codigo: 'pt', rotulo: 'PT', bandeiraSvg: '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#D9262A"/><rect width="12" height="20" fill="#046A38"/><circle cx="12" cy="10" r="4.5" fill="#FFD700" stroke="#fff" stroke-width="0.6"/></svg>' },
      { codigo: 'en', rotulo: 'EN', bandeiraSvg: '<svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="30" fill="#00247d"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/></svg>' },
      { codigo: 'fr', rotulo: 'FR', bandeiraSvg: '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#0055A4"/><rect x="20" width="10" height="20" fill="#EF4135"/></svg>' },
      { codigo: 'es', rotulo: 'ES', bandeiraSvg: '<svg viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>' },
    ];

    const UI = {
      subtitulo: {
        pt: "Deliciosas francesinhas do forno para o prato",
        en: "Delicious oven-baked francesinhas, from the oven to your plate",
        fr: "De délicieuses francesinhas du four à votre assiette",
        es: "Deliciosas francesinhas del horno al plato",
      },

    function escapar(texto) {
      const div = document.createElement('div');
      div.textContent = texto;

    }

    function renderBadge(chave) {
      if (!chave || !BADGES[chave]) return '';
      return `<span class="etiqueta">${escapar(BADGES[chave][idiomaAtual])}</span>`;
    }

    function renderCartaoFoto(item, idx, catId) {
      const foto = item.foto ? `<img src="${item.foto}" alt="${escapar(item.nome[idiomaAtual])}" loading="lazy" />` : '';
      return `
        <div class="item" data-cat="${catId}" data-idx="${idx}">
          <div class="foto">${foto}</div>
          <div class="info">
            <div class="linha-topo">
              <h3>${escapar(item.nome[idiomaAtual])}${renderBadge(item.badge)}</h3>
              <span class="preco">${item.preco}</span>
            </div>
            <p>${escapar(item.desc[idiomaAtual])}</p>
          </div>
        </div>`;
    }

    function temIngredientes(item) {
      if (item.ingredientesFotos && item.ingredientesFotos.length) return true;
      return Boolean(item.desc) && !item.semListaIngredientes;
    }

    function renderItemLista(item, idx, catId) {
      const classeFoto = item.simbolo ? 'simbolo' : '';
      const textoVerMais = temIngredientes(item) ? UI.verIngredientes[idiomaAtual] : UI.verDetalhes[idiomaAtual];
      const foto = item.foto ? `<img class="${classeFoto}" src="${item.foto}" alt="${escapar(item.nome[idiomaAtual])}" loading="lazy" />` : '';
      return `
        <div class="lista-item" data-cat="${catId}" data-idx="${idx}">
          <div class="foto-metade">${foto}</div>
          <div class="info-metade">
            <div class="linha-topo">
              <h3>${escapar(item.nome[idiomaAtual])}${renderBadge(item.badge)}</h3>
              <span class="preco">${item.preco}</span>
            </div>
            <span class="ver-mais">${escapar(textoVerMais)}</span>
          </div>
        </div>`;
    }

    function renderLinhaExtra(item) {
      return `<div class="linha-extra"><span>${escapar(item.nome[idiomaAtual])}</span><span>${item.preco}</span></div>`;
    }

    function renderCategoria(cat) {
      let corpo = '';
      if (cat.tipo === 'fotos') {
        corpo = `<div class="grelha-fotos">${cat.items.map((item, idx) => renderCartaoFoto(item, idx, cat.id)).join('')}</div>`;
      } else {
        corpo = `<div class="grelha-cartoes-horizontais">${cat.items.map((item, idx) => renderItemLista(item, idx, cat.id)).join('')}</div>`;
      }
      return `
        <section class="categoria" id="${cat.id}">
          <h2>${escapar(cat.nome[idiomaAtual])}</h2>
          <p class="descricao-categoria">${escapar(cat.descricao[idiomaAtual])}</p>
          ${corpo}
        </section>`;
    }

      const grupos = BEBER.grupos.map((grupo) => `
        <p class="subtitulo-lista">${escapar(grupo.titulo[idiomaAtual])}</p>

      `).join('');
      return `
        <section class="categoria" id="${BEBER.id}">
          <h2>${escapar(BEBER.nome[idiomaAtual])}</h2>
          <p class="descricao-categoria">${escapar(BEBER.descricao[idiomaAtual])}</p>

    function abrirMenu() {

    let modalAtual = null;

    function extrairIngredientes(desc) {
      if (!desc) return [];
      const conjuncaoPorIdioma = { pt: ' e ', en: ' and ', fr: ' et ', es: ' y ' };
      const normalizado = desc.replace(new RegExp(conjuncaoPorIdioma[idiomaAtual], 'gi'), ', ');
      return normalizado
        .split(',')
        .map((parte) => parte.trim().replace(/\.$/, ''))
        .filter((parte) => parte.length > 1)
        .map((parte) => parte.charAt(0).toUpperCase() + parte.slice(1));
    }

    function abrirModal(catId, idx) {
      const cat = CATEGORIAS.find((c) => c.id === catId);
      if (!cat) return;
      const item = cat.items[idx];
      if (!item) return;
      modalAtual = { catId, idx };

      const nomeCompleto = item.nome[idiomaAtual];
      const [nomePrincipal, nomeSecundario] = nomeCompleto.split('|').map((parte) => parte && parte.trim());

      document.getElementById('modal-nome-principal').textContent = nomePrincipal;
      const secundarioEl = document.getElementById('modal-nome-secundario');
      secundarioEl.textContent = nomeSecundario || '';
      secundarioEl.style.display = nomeSecundario ? 'block' : 'none';

      document.getElementById('modal-badge').innerHTML = renderBadge(item.badge);
      document.getElementById('modal-preco').textContent = item.preco;

      const descCurta = item.desc ? item.desc[idiomaAtual] : '';
      const descParaModal = item.descModal ? item.descModal[idiomaAtual] : descCurta;
      const paragrafos = Array.isArray(descParaModal) ? descParaModal : [descParaModal];
      const descEl = document.getElementById('modal-desc');
      descEl.innerHTML = paragrafos.filter(Boolean).map((p) => `<p>${escapar(p)}</p>`).join('');
      descEl.style.display = descParaModal ? 'block' : 'none';

      const tituloIngEl = document.getElementById('modal-ingredientes-titulo');
      const listaIngEl = document.getElementById('modal-lista-ingredientes');
      if (item.ingredientesFotos && item.ingredientesFotos.length) {
        tituloIngEl.textContent = UI.ingredientesTitulo[idiomaAtual];
        tituloIngEl.style.display = 'block';
        listaIngEl.classList.add('lista-ingredientes-fotos');
        listaIngEl.style.display = 'flex';
        listaIngEl.innerHTML = item.ingredientesFotos.map((ing) => `
          <div class="ingrediente-foto">
            <img src="${ing.foto}" alt="${escapar(ing.nome[idiomaAtual])}" loading="lazy" />
            <span>${escapar(ing.nome[idiomaAtual])}</span>
          </div>`).join('');
      } else {
        listaIngEl.classList.remove('lista-ingredientes-fotos');
        const ingredientes = item.semListaIngredientes ? [] : extrairIngredientes(descCurta);
        if (ingredientes.length) {
          tituloIngEl.textContent = UI.ingredientesTitulo[idiomaAtual];
          tituloIngEl.style.display = 'block';
          listaIngEl.style.display = 'flex';
          listaIngEl.innerHTML = ingredientes.map((ing) => `<span class="tag-ingrediente">${escapar(ing)}</span>`).join('');
        } else {
          tituloIngEl.style.display = 'none';
          listaIngEl.style.display = 'none';
          listaIngEl.innerHTML = '';
        }
      }

      const fotoEl = document.getElementById('modal-foto');
      fotoEl.innerHTML = item.foto
        ? `<img class="${item.simbolo ? 'simbolo' : ''}" src="${item.foto}" alt="${escapar(nomePrincipal)}" />`
        : '';


      document.getElementById('fundo-modal').classList.add('visivel');
      document.getElementById('modal-prato').classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      modalAtual = null;
      document.getElementById('fundo-modal').classList.remove('visivel');
      document.getElementById('modal-prato').classList.remove('aberto');
      document.body.style.overflow = '';
    }

    function navegarModal(delta) {
      if (!modalAtual) return;
      const cat = CATEGORIAS.find((c) => c.id === modalAtual.catId);
      if (!cat) return;
      const novoIdx = (modalAtual.idx + delta + cat.items.length) % cat.items.length;
      abrirModal(modalAtual.catId, novoIdx);
    }

    function inicializarModal() {
      document.getElementById('modal-fechar').addEventListener('click', fecharModal);
      document.getElementById('fundo-modal').addEventListener('click', fecharModal);
    }

    function renderSeletorIdiomas() {
      const seletor = document.getElementById('seletor-idiomas');
      seletor.innerHTML = IDIOMAS.map((idioma) => `
        <button data-idioma="${idioma.codigo}" class="${idioma.codigo === idiomaAtual ? 'ativo' : ''}">${idioma.bandeiraSvg}${idioma.rotulo}</button>
      `).join('');
      seletor.querySelectorAll('button').forEach((botao) => {
        botao.addEventListener('click', () => {
          idiomaAtual = botao.dataset.idioma;
          localStorage.setItem('duforno-idioma', idiomaAtual);
          renderTudo();
        });
      });
    }

      document.documentElement.lang = idiomaAtual;
      document.title = UI.tituloAba[idiomaAtual];

      document.getElementById('rodape-aviso').textContent = UI.aviso[idiomaAtual];
      document.getElementById('texto-botao-menu').textContent = UI.menuBotao[idiomaAtual];
      document.getElementById('texto-cabecalho-menu').textContent = UI.menuCabecalho[idiomaAtual];
    }

    function ativarNavegacaoEObservador() {
      const botoes = document.querySelectorAll('nav.categorias button[data-categoria]');
      const seccoes = document.querySelectorAll('section.categoria');

      botoes.forEach((botao) => {
        botao.addEventListener('click', () => {
          botoes.forEach((b) => b.classList.remove('ativo'));
          botao.classList.add('ativo');
          const destino = document.getElementById(botao.dataset.categoria);
          if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
          fecharMenu();
        });
      });

      const observador = new IntersectionObserver(
        (entradas) => {
          entradas.forEach((entrada) => {
            if (entrada.isIntersecting) {
              botoes.forEach((b) => b.classList.remove('ativo'));
              const botaoAtivo = document.querySelector(`nav.categorias button[data-categoria="${entrada.target.id}"]`);
              if (botaoAtivo) botaoAtivo.classList.add('ativo');
            }
          });
        },
        { rootMargin: '-45% 0px -45% 0px' }
      );

      seccoes.forEach((seccao) => observador.observe(seccao));

      document.querySelectorAll('.item[data-cat], .lista-item[data-cat]').forEach((el) => {
        el.addEventListener('click', () => abrirModal(el.dataset.cat, parseInt(el.dataset.idx, 10)));
      });
    }

    function inicializarMenuGaveta() {
      document.getElementById('botao-abrir-menu').addEventListener('click', abrirMenu);
      document.getElementById('botao-fechar-menu').addEventListener('click', fecharMenu);
      document.getElementById('fundo-menu').addEventListener('click', fecharMenu);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { fecharModal(); fecharMenu(); }
        else if (modalAtual && e.key === 'ArrowRight') navegarModal(1);
        else if (modalAtual && e.key === 'ArrowLeft') navegarModal(-1);
      });
    }

    function renderTudo() {
      fecharModal();
      renderSeletorIdiomas();
      renderTextosFixos();
      renderNav();

      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML =
        CATEGORIAS.map(renderCategoria).join('') +
        renderBeber() +
        renderExtras();

      ativarNavegacaoEObservador();
    }

    inicializarMenuGaveta();
    inicializarModal();
    renderTudo();
  </script>
</body>
</html>
